# Deletes RealtimeEvent older than 7 days. Does not touch AuditEvent.
# Same app image as the Deployment (corporate registries rarely allowlist postgres:17).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: arquitetura-kanban-realtime-cleanup
  namespace: arquitetura-kanban
  labels:
    app.kubernetes.io/name: arquitetura-kanban
    app.kubernetes.io/component: realtime-cleanup
spec:
  schedule: "0 3 * * *"
  timeZone: America/Sao_Paulo
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: arquitetura-kanban
            app.kubernetes.io/component: realtime-cleanup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: CHANGEME_REGISTRY/arquitetura-kanban:CHANGEME_TAG
              imagePullPolicy: IfNotPresent
              command: ["node", "scripts/cleanup-realtime-events.mjs"]
              envFrom:
                - secretRef:
                    name: arquitetura-kanban
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              resources:
                requests:
                  cpu: 50m
                  memory: 128Mi
                limits:
                  cpu: 200m
                  memory: 256Mi
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: tmp
              emptyDir: {}
