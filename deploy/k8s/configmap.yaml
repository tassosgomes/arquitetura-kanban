# Non-secret runtime. APP_URL and OIDC_* stay in the Secret (docs/guides/oidc.md §4.6).
apiVersion: v1
kind: ConfigMap
metadata:
  name: arquitetura-kanban
  namespace: arquitetura-kanban
  labels:
    app.kubernetes.io/name: arquitetura-kanban
data:
  APP_TIME_ZONE: America/Sao_Paulo
  NODE_ENV: production
  PORT: "3000"
  HOSTNAME: "0.0.0.0"
  AUTH_TRUST_HOST: "true"
  NEXT_TELEMETRY_DISABLED: "1"
