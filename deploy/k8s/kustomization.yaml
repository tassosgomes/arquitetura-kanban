apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: arquitetura-kanban
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  - pdb.yaml
  - cronjob-cleanup.yaml
images:
  - name: CHANGEME_REGISTRY/arquitetura-kanban
    newName: CHANGEME_REGISTRY/arquitetura-kanban
    newTag: CHANGEME_TAG
# secret.yaml and migrate-job.yaml are NOT here. Apply them out of band.
# SQL for the CronJob is baked into the image from deploy/sql/.
