# Local stack: app + PostgreSQL only. No Identity Provider.
# Procedure: docs/guides/local-development.md

name: arquitetura-kanban

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arquitetura}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGEME}
      POSTGRES_DB: ${POSTGRES_DB:-arquitetura}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Sao_Paulo}
      DATABASE_URL: postgresql://${POSTGRES_USER:-arquitetura}:${POSTGRES_PASSWORD:-CHANGEME}@postgres:5432/${POSTGRES_DB:-arquitetura}
      NEXT_TELEMETRY_DISABLED: "1"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    networks:
      - internal

volumes:
  postgres_data:
  app_node_modules:

networks:
  internal:
    driver: bridge
