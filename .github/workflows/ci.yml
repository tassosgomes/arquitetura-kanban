# CI of the MVP. Dummy OIDC/AUTH values are placeholders, not real secrets.
# Do not echo environment values in logs.
# Homologação Vercel aplica migrate no build (`npm run vercel-build`), não neste workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Sequential steps: any failure fails this job and blocks `build` via needs.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: arquitetura
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: arquitetura_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arquitetura -d arquitetura_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      APP_URL: http://localhost:3000
      APP_TIME_ZONE: America/Sao_Paulo
      DATABASE_URL: postgresql://arquitetura:ci_password@localhost:5432/arquitetura_ci
      OIDC_ISSUER: https://ci.example.test/oidc
      OIDC_CLIENT_ID: ci-dummy-client
      OIDC_CLIENT_SECRET: ci-dummy-secret
      OIDC_SCOPES: openid profile email
      AUTH_SECRET: "ci-dummy-auth-secret-min-32-chars!!"
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    name: build
    needs: [verify]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APP_URL: http://localhost:3000
      APP_TIME_ZONE: America/Sao_Paulo
      DATABASE_URL: postgresql://arquitetura:ci_password@localhost:5432/arquitetura_ci
      OIDC_ISSUER: https://ci.example.test/oidc
      OIDC_CLIENT_ID: ci-dummy-client
      OIDC_CLIENT_SECRET: ci-dummy-secret
      OIDC_SCOPES: openid profile email
      AUTH_SECRET: "ci-dummy-auth-secret-min-32-chars!!"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build
        run: npm run build
